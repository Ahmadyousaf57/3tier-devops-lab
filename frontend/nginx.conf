server {
    listen 80;

    # Frontend ki apni HTML/CSS/JS serve karo
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /api/ se shuru hone wali koi bhi request backend tak forward karo
    location /api/ {
        proxy_pass http://10.0.2.210:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
